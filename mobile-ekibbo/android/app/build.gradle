plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.mobipay.agrobase.ekibbo"
    compileSdk 36
    ndkVersion = '28.1.13356709'

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.mobipay.agrobase.ekibbo"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Android 15+ / 16 KB page sizes: uncompressed native libs are mapped
    // page-aligned by the loader. useLegacyPackaging=false (the AGP default)
    // guarantees this; pinned explicitly so nothing can silently flip it.
    // NDK r28 (28.1.13356709, pinned at the top of this file) builds 16
    // KB-aligned .so files by default, and the Flutter engine (≥3.22) is
    // 16 KB-ready — so the app installs and runs on 16 KB devices (Pixel
    // with Android 15+ 16 KB kernels, required by Google Play from Nov 2025).
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
    // No buildToolsVersion pin — AGP 8.13 pairs the default build-tools with
    // compileSdk 36. The old '30.0.3' pin breaks modern SDK 36 builds.
}

flutter {
    source = "../.."
}

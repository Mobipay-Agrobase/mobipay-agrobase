pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Upgraded from 8.9.1 → 8.11.1 to silence the Flutter warning:
    //   "Flutter support for your project's Android Gradle Plugin version will soon be dropped."
    // Future Flutter releases require AGP >= 8.11.1.
    id "com.android.application" version "8.11.1" apply false
    // Upgraded from 2.1.0 → 2.2.20 to silence the Flutter warning:
    //   "Flutter support for your project's Kotlin version will soon be dropped."
    // Future Flutter releases require Kotlin >= 2.2.20.
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// ─── Force every Android plugin (location, google_maps_flutter, etc.) to
// compile against the same modern SDK as the app. Older plugins pin
// compileSdk 33 while their AndroidX transitive deps require 34+, which
// fails AAR metadata checks (e.g. :location:checkDebugAarMetadata).
// Central override keeps all plugins aligned regardless of their own pins.
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdk 36
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

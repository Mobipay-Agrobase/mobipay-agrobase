org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# Force Gradle to use Java 17 (from Android Studio's bundled JBR) instead of
# the system's Java 25, which Gradle 8.10 can't handle (class file version 69).
# If this path doesn't exist on your machine, run `/usr/libexec/java_home -V`
# to find your Java 17 home and replace the path below.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

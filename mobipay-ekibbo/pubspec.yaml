name: mobipay_ekibbo
description: "EKiBBO Agrobase — Coffee exporter field officer & farmer app for Uganda"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  flutter_svg: ^2.0.7
  cached_network_image: ^3.1.0

  # ─── EKiBBO additions ───
  http: ^1.2.2                              # API client to Next.js backend
  http_parser: ^4.0.2                       # MediaType parsing for file uploads
  shared_preferences: ^2.1.0                # local session/token storage
  image_picker: ^1.0.4                     # farmer photos, ID proofs, training attachments
  url_launcher: ^6.1.0                     # call farmer / open external links
  geolocator: ^13.0.2                      # GPS for plot pin + farm boundary
  mobile_scanner: ^5.2.3                   # QR code scanning
  sqflite: ^2.4.0                          # offline cache (farmer list, trainings)
  path_provider: ^2.1.0                    # file paths for sqflite
  fl_chart: ^0.69.0                        # breakdown dashboard charts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
